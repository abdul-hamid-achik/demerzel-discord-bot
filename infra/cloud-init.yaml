#cloud-config
# Bootstrap for the Hermes Translator droplet.
# Renders via Pulumi: __SSH_PUBLIC_KEY__ is interpolated before the file is sent.
#
# We skip package_upgrade on first boot - it adds 5-10 minutes and bounces
# sshd repeatedly. Security updates run via unattended-upgrades afterward.
# Comments stay ASCII-only - cloud-init's YAML loader rejects non-ASCII bytes.

package_update: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - fail2ban
  - unattended-upgrades
  - git

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      UsePAM yes
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 3
      bantime = 1h
      findtime = 10m

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  - path: /opt/hermes/README.txt
    permissions: "0644"
    content: |
      Hermes Translator droplet.
      Deploy app to /opt/hermes/app and run `docker compose up -d`.

runcmd:
  # Docker official repo
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # 2GB swap (cushion even on a 2GB box; cheap insurance)
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf

  # UFW (cloud firewall already gates ingress; UFW is defense-in-depth)
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Application directory
  - mkdir -p /opt/hermes/app
  - chown -R deploy:deploy /opt/hermes

  - systemctl enable --now fail2ban
  - systemctl restart ssh

final_message: "Hermes droplet ready in $UPTIME seconds. SSH as deploy@<ip>."
